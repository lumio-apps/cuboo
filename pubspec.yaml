name: cuboo
description: "Cuboo is a calm block puzzle for Android. Fully offline, no ads, no tracking."
publish_to: 'none'

version: 1.1.0+2

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.5.0
  http: ^1.2.0
  package_info_plus: ^8.0.0
  path_provider: ^2.1.0
  open_filex: ^4.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.0

flutter:
  uses-material-design: true
